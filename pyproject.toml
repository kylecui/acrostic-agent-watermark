[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acrostic-agent-watermark"
version = "0.1.0"
description = "Agent-level digital watermarking via acrostic-style token transforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AAWM Team"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
nlp = ["nltk>=3.8"]
llm = ["openai>=1.0", "anthropic>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]
