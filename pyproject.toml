[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acrostic-agent-watermark"
version = "0.14.2"
description = "Traceable text watermarking for AI-agent long-form deliverables — anti-leak attribution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AAWM Team"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
langchain = ["langchain>=0.3"]
litellm = ["litellm>=1.40"]
server = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2.0", "httpx>=0.24"]
dev = ["pytest>=7.0", "pytest-asyncio", "httpx"]
nlp = ["nltk>=3.8"]
llm = ["openai>=1.0", "anthropic>=0.20"]

[project.scripts]
aawm = "aawm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aawm = ["data/*.json", "data/demo_corpus/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
