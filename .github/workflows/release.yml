# PyPI Trusted Publisher 发布流程
#
# 触发：推送 v* tag（如 `git tag v0.12.0 && git push origin v0.12.0`）
#
# 使用 PyPI Trusted Publisher（OIDC），无需配置 API token。首次使用前需在
# PyPI 上登记一次（仓库所有者操作）：
#   https://pypi.org/manage/account/publishing/ → Add a new pending publisher
#     PyPI project name : acrostic-agent-watermark
#     Owner             : kylecui
#     Repository name   : acrostic-agent-watermark
#     Workflow name     : release.yml
#     Environment name  : release
# 并在 GitHub 仓库 Settings → Environments 创建名为 `release` 的 environment
# （可加 reviewer 保护，仅在 publish job 生效，不影响 test/build）。

name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: {}

jobs:
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,langchain,litellm,openai]"

      - name: Run full test suite
        run: python -m pytest tests/ -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: build
    # 必须与 PyPI Trusted Publisher 登记的 environment 名称一致
    environment: release
    permissions:
      id-token: write  # OIDC：PyPI 据此验证发布请求来自本仓库
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
